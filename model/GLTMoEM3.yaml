METRLA:
  num_nodes: 207
  in_steps: 12
  out_steps: 12

  train_size: 0.7
  val_size: 0.1

  time_of_day: True
  day_of_week: True

  lr: 0.002
  weight_decay: 0.0001
  milestones: [25, 50, 75, 100, 125, 150]
  lr_decay_rate: 0.5
  batch_size: 64
  max_epochs: 300
  early_stop: 20
  use_cl: False
  cl_step_size: 2500
  #clip_grad: 5

  model_args:
    num_nodes: 207
    num_group: 5
    input_len: 12
    input_dim: 3
    input_embedding_dim: 24
    output_len: 12
    num_layer: 3
    if_node: True
    node_dim: 24
    if_T_i_D: True
    if_D_i_W: True
    temp_dim_tid: 24
    temp_dim_diw: 24
    time_of_day_size: 288
    day_of_week_size: 7

